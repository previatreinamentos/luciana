<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Luciana - Portal de Ensino Prático</title>

  <!-- Cor da barra de navegação/status no celular -->

  <!-- META TAGS OPEN GRAPH (CARD DE PREVIEW) -->

  <meta property="og:description" content="Acesse nossa plataforma de ensino e agendamento de aulas.">

  <!-- Favicons e Apple Touch Icon -->
  <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/pw/AP1GczNDEUMRtWrusdox_5RpkkJARUcLgcx_VIvGsty5dkQmE479LYBQBM6dvhLaxsIFs_tCwspiYgYeJyJPGaUUwzNOctBwDF5VW1HlX0ywGFECf6bXx154LunZ_Kal4Y_lfLSKOCkkxsxRPt9JWWMvwM7z=w875-h779-s-no-gm?authuser=0">
  <link rel="apple-touch-icon" sizes="180x180" href="https://lh3.googleusercontent.com/pw/AP1GczNDEUMRtWrusdox_5RpkkJARUcLgcx_VIvGsty5dkQmE479LYBQBM6dvhLaxsIFs_tCwspiYgYeJyJPGaUUwzNOctBwDF5VW1HlX0ywGFECf6bXx154LunZ_Kal4Y_lfLSKOCkkxsxRPt9JWWMvwM7z=w875-h779-s-no-gm?authuser=0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #ffffff;
      font-family: Arial, sans-serif;
    }

    .top-bar {
      width: 100%;
      height: 75px; 
      background-color: #042e2a;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
      padding: 0 10px;
    }

    .content-frame {
      width: 100%;
      height: calc(100% - 75px);
      border: none;
      display: block;
    }

    .install-banner {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      max-width: 400px;
      background-color: #000000;
      color: #ffffff;
      border-radius: 12px;
      padding: 18px 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 9999;
      display: none;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .install-banner p {
      font-size: 0.95rem;
      font-weight: 500;
      margin-bottom: 14px;
    }

    .btn-install {
      background-color: #00e676;
      color: #000000;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-dismiss {
      background: transparent;
      color: #cccccc;
      border: none;
      font-size: 0.9rem;
      cursor: pointer;
      padding: 8px 12px;
    }
  </style>
</head>
<body>

  <header class="top-bar">
    AUTOESCOLA DIGITAL LUCIANA
  </header>

  <iframe 
    class="content-frame" 
    src="https://script.google.com/macros/s/AKfycbzmPXiteUMTy73VzhXBgXCJyME4LBSliWu-v8-P0R_UVXjvQQOopWi5jtIb1evRJsU7/exec" 
    title="Conteúdo Incorporado"
    allow="fullscreen">
  </iframe>

  <div id="pwaBanner" class="install-banner">
    <p>Deseja instalar nosso aplicativo para acesso rápido?</p>
    <div>
      <button id="btnInstall" class="btn-install">Instalar Aplicativo</button>
      <button id="btnDismiss" class="btn-dismiss">Agora não</button>
    </div>
  </div>

  <script>
    let deferredPrompt;
    const banner = document.getElementById('pwaBanner');
    const btnInstall = document.getElementById('btnInstall');
    const btnDismiss = document.getElementById('btnDismiss');

    const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone;

    if (!isStandalone) {
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        deferredPrompt = e;
        banner.style.display = 'flex';
      });

      window.addEventListener('load', () => {
        setTimeout(() => {
          if (!deferredPrompt && !isStandalone) {
            banner.style.display = 'flex';
          }
        }, 1200);
      });
    }

    btnInstall.addEventListener('click', async () => {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        banner.style.display = 'none';
      } else {
        alert('Para instalar no iPhone (iOS):\n1. Toque no ícone de Compartilhar.\n2. Escolha "Adicionar à Tela de Início".');
      }
    });

    btnDismiss.addEventListener('click', () => {
      banner.style.display = 'none';
    });
  </script>
</body>
</html>
